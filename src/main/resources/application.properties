spring.config.import=application-secret.properties
spring.application.name=movieshark
spring.datasource.url=${DB_URL}
spring.datasource.username=root
spring.datasource.password=${DB_PASS}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Automatically update schema
spring.jpa.hibernate.ddl-auto=update
# Show SQL statements
logging.level.org.hibernate.SQL=DEBUG
# Show parameters passed to SQL
logging.level.org.hibernate.type.descriptor.sql=TRACE
# (optional) Use the correct dialect explicitly
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000  
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME}
spring.mail.password=${GMAIL_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

